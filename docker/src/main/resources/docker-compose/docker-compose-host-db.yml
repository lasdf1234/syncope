# Full deployment (Core, Console, Enduser) with database on the host (not in Docker).
# Same stack as docker-compose-postgresql.yml but without the db service.
#
# All database settings come from .env (see .env.host-db.example). No defaults in this file.
#
# DB_PROFILE — Spring profile, must be one of:
#   postgresql | mysql | mariadb | oracle
#
# Example .env blocks (host = host.docker.internal):
#
#   postgresql
#     DB_PROFILE=postgresql
#     DB_URL=jdbc:postgresql://host.docker.internal:5432/syncope?stringtype=unspecified
#     DB_USER=syncope
#     DB_PASSWORD=syncope
#     DB_SCHEMA=
#
#   mysql
#     DB_PROFILE=mysql
#     DB_URL=jdbc:mysql://host.docker.internal:3306/syncope?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
#     DB_USER=syncope
#     DB_PASSWORD=syncope
#     DB_SCHEMA=
#
#   mariadb
#     DB_PROFILE=mariadb
#     DB_URL=jdbc:mariadb://host.docker.internal:3306/syncope?characterEncoding=UTF-8&relaxAutoCommit=true&useSSL=false
#     DB_USER=syncope
#     DB_PASSWORD=syncope
#     DB_SCHEMA=
#
#   oracle
#     DB_PROFILE=oracle
#     DB_URL=jdbc:oracle:thin:@host.docker.internal:1521/FREEPDB1
#     DB_USER=syncope
#     DB_PASSWORD=syncope
#     DB_SCHEMA=SYNCOPE
#
# Containers reach the host via host.docker.internal (macOS / Windows / Linux with extra_hosts).

services:
   syncope:
     image: apache/syncope:${SYNCOPE_VERSION}
     ports:
       - "18080:8080"
     restart: always
     extra_hosts:
       - "host.docker.internal:host-gateway"
     environment:
       SPRING_PROFILES_ACTIVE: docker,${DB_PROFILE},saml2
       DB_URL: ${DB_URL}
       DB_USER: ${DB_USER}
       DB_PASSWORD: ${DB_PASSWORD}
       DB_SCHEMA: ${DB_SCHEMA}
       DB_POOL_MAX: 20
       DB_POOL_MIN: 5
       OPENJPA_REMOTE_COMMIT: sjvm
       KEYMASTER_ADDRESS: http://localhost:8080/syncope/rest/keymaster
       KEYMASTER_USERNAME: ${KEYMASTER_USERNAME}
       KEYMASTER_PASSWORD: ${KEYMASTER_PASSWORD}
       SERVICE_DISCOVERY_ADDRESS: http://syncope:8080/syncope/rest/
       ANONYMOUS_USER: ${ANONYMOUS_USER}
       ANONYMOUS_KEY: ${ANONYMOUS_KEY}

   syncope-console:
     depends_on:
       - syncope
     image: apache/syncope-console:${SYNCOPE_VERSION}
     ports:
       - "28080:8080"
     restart: always
     environment:
       SPRING_PROFILES_ACTIVE: docker
       KEYMASTER_ADDRESS: http://syncope:8080/syncope/rest/keymaster
       KEYMASTER_USERNAME: ${KEYMASTER_USERNAME}
       KEYMASTER_PASSWORD: ${KEYMASTER_PASSWORD}
       SERVICE_DISCOVERY_ADDRESS: http://syncope-console:8080/syncope-console/
       ANONYMOUS_USER: ${ANONYMOUS_USER}
       ANONYMOUS_KEY: ${ANONYMOUS_KEY}

   syncope-enduser:
     depends_on:
       - syncope
     image: apache/syncope-enduser:${SYNCOPE_VERSION}
     ports:
       - "38080:8080"
     restart: always
     environment:
       SPRING_PROFILES_ACTIVE: docker
       KEYMASTER_ADDRESS: http://syncope:8080/syncope/rest/keymaster
       KEYMASTER_USERNAME: ${KEYMASTER_USERNAME}
       KEYMASTER_PASSWORD: ${KEYMASTER_PASSWORD}
       SERVICE_DISCOVERY_ADDRESS: http://syncope-enduser:8080/syncope-enduser/
       ANONYMOUS_USER: ${ANONYMOUS_USER}
       ANONYMOUS_KEY: ${ANONYMOUS_KEY}
